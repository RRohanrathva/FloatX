name: Build APK from ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "No .zip file found in repo root"; exit 1; fi
          rm -rf /tmp/proj
          mkdir -p /tmp/proj
          unzip -q "$ZIP" -d /tmp/proj
          SETTINGS=$(find /tmp/proj -maxdepth 4 -name "settings.gradle.kts" | head -n1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found in zip"; exit 1; fi
          PROJ_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJ_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJ_DIR/app/src/main/aidl/com/floatx/app/shizuku" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean assembleRelease --stacktrace


      - name: Collect APK
        run: |
          mkdir -p dist
          cp "${{ env.PROJECT_DIR }}"/app/build/outputs/apk/release/*.apk dist/FloatX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatX-apk
          path: dist/FloatX.apk
